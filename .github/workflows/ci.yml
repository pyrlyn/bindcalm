name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    # TEMP: self-hosted xcode-27-local until hosted xcode-27 exists (fork PRs keep the hosted label)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'xcode-27-local' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test && swift build && swift build -c release
